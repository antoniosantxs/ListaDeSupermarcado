<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro / Edição de Item</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-5" style="max-width: 650px;">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0" th:text="${item.id == null ? 'Cadastrar Novo Item' : 'Editar Item'}">Formulário</h4>
        </div>
        <div class="card-body">

            <form th:action="@{/itens/salvar}" th:object="${item}" method="post">
                <input type="hidden" th:field="*{id}" />

                <!-- Nome -->
                <div class="mb-3">
                    <label class="form-label">Nome do Item *</label>
                    <input type="text" th:field="*{nome}" class="form-control" th:errorclass="is-invalid" placeholder="Ex: Leite Integral" />
                    <div class="invalid-feedback" th:errors="*{nome}"></div>
                </div>

                <!-- Categoria -->
                <div class="mb-3">
                    <label class="form-label">Categoria *</label>
                    <input type="text" th:field="*{categoria}" class="form-control" th:errorclass="is-invalid" placeholder="Ex: Laticínios" />
                    <div class="invalid-feedback" th:errors="*{categoria}"></div>
                </div>

                <div class="row">
                    <!-- Unidade de Medida -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Unidade de Medida</label>
                        <input type="text" th:field="*{unidadeMedida}" class="form-control" placeholder="Ex: Litro, Kg, Unidade" />
                    </div>

                    <!-- Preço Unitário -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Preço Unitário (R$)</label>
                        <input type="number" step="0.01" th:field="*{precoUnitario}" class="form-control" th:errorclass="is-invalid" placeholder="0.00" />
                        <div class="invalid-feedback" th:errors="*{precoUnitario}"></div>
                    </div>
                </div>

                <div class="row">
                    <!-- Quantidade a Comprar -->
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Qtd. a Comprar</label>
                        <input type="number" th:field="*{quantidade}" class="form-control" th:errorclass="is-invalid" />
                        <div class="invalid-feedback" th:errors="*{quantidade}"></div>
                    </div>

                    <!-- Quantidade em Estoque -->
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Qtd. em Estoque</label>
                        <input type="number" th:field="*{quantidadeEstoque}" class="form-control" th:errorclass="is-invalid" placeholder="Opcional" />
                        <div class="invalid-feedback" th:errors="*{quantidadeEstoque}"></div>
                    </div>

                    <!-- Estoque Mínimo -->
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Estoque Mínimo</label>
                        <input type="number" th:field="*{estoqueMinimo}" class="form-control" th:errorclass="is-invalid" placeholder="Opcional" />
                        <div class="invalid-feedback" th:errors="*{estoqueMinimo}"></div>
                    </div>
                </div>

                <!-- Checkbox Comprado -->
                <div class="form-check mb-4">
                    <input type="checkbox" id="comprado" th:field="*{comprado}" class="form-check-input" />
                    <label for="comprado" class="form-check-label">Item já comprado?</label>
                </div>

                <div class="d-flex justify-content-between">
                    <a th:href="@{/itens}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success">Salvar Registro</button>
                </div>
            </form>

        </div>
    </div>
</div>

</body>
</html>
