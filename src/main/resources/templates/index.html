<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Supermercado</title>
    <!-- CSS do Bootstrap 5 via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-4">
    <h1 class="mb-4">🛒 Lista de Supermercado & Controle de Estoque</h1>

    <!-- mensagens ao usuario, nomes iguais aos do controller -->
    <div th:if="${mensagemSucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${mensagemSucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${mensagemErro}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${mensagemErro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Barra de pesquisa -->
    <div class="row mb-3">
        <div class="col-md-8">
            <form th:action="@{/itens}" method="get" class="d-flex gap-2">
                <input type="text" name="nome" class="form-control" placeholder="Buscar por nome..." th:value="${termoBusca}">
                <button type="submit" class="btn btn-primary">Pesquisar</button>
                <a th:href="@{/itens}" class="btn btn-outline-secondary">Limpar</a>
            </form>
        </div>
        <!-- botão de ação de novo cadastro -->
        <div class="col-md-4 text-end">
            <a th:href="@{/itens/novo}" class="btn btn-success">+ Novo Item</a>
        </div>
    </div>

    <!-- lista em tabela -->
    <table class="table table-striped table-hover align-middle bg-white shadow-sm rounded">
        <thead class="table-dark">
        <tr>
            <!-- chave de ordenação ascendente/descendente -->
            <th>
                <a th:href="@{/itens(campo='nome', ordem='asc')}" class="text-white text-decoration-none">Nome 🔼</a>
                <a th:href="@{/itens(campo='nome', ordem='desc')}" class="text-white text-decoration-none">🔽</a>
            </th>
            <!-- ordenação por categoria -->
            <th>
                <a th:href="@{/itens(campo='categoria', ordem='asc')}" class="text-white text-decoration-none">Categoria 🔼</a>
                <a th:href="@{/itens(campo='categoria', ordem='desc')}" class="text-white text-decoration-none">🔽</a>
            </th>
            <th>Estoque Atual</th>
            <th>Estoque Mín.</th>
            <th>Status</th>
            <th>
                <a th:href="@{/itens(campo='precoUnitario', ordem='asc')}" class="text-white text-decoration-none">Preço 🔼</a>
                <a th:href="@{/itens(campo='precoUnitario', ordem='desc')}" class="text-white text-decoration-none">🔽</a>
            </th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${itens}">
            <td th:text="${item.nome}"></td>
            <td th:text="${item.categoria}"></td>
            <td th:text="${item.quantidadeEstoque}"></td>
            <td th:text="${item.estoqueMinimo}"></td>
            <!-- Campo dinâmico de status -->
            <td th:text="${item.statusEstoque}"></td>
            <td th:text="${'R$ ' + #numbers.formatDecimal(item.precoUnitario, 1, 'POINT', 2, 'COMMA')}"></td>
            <td>
                <!-- permitir a edição -->
                <a th:href="@{/itens/editar/{id}(id=${item.id})}" class="btn btn-warning btn-sm">Editar</a>

                <!-- exclusão de item, GET em /itens/excluir/{id} como no controller -->
                <a th:href="@{/itens/excluir/{id}(id=${item.id})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Deseja excluir este item?')">Excluir</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(itens)}">
            <td colspan="7" class="text-center text-muted">Nenhum item encontrado.</td>
        </tr>
        </tbody>
    </table>
</div>

<!-- JS do Bootstrap para fechar os Alertas e interações -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
